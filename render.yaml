# render.yaml pour Durama

# --- Base de données ---
# (Non utilisée tant que USE_POSTGRES=1 n'est pas défini : voir Durama/settings.py)
databases:
  - name: duramadb
    plan: free
    databaseName: durama
    user: durama_user

# --- Services web (backend Django) ---
services:
  - type: web
    name: durama-backend
    plan: free
    env: python
    runtime: python

    # - plus de « makemigrations » au déploiement : les migrations sont créées en local et commitées
    # - plus de « || true » : si une migration échoue, le déploiement s'arrête au lieu de lancer
    #   un site cassé
    # - plus de « loaddata data.json » : ce fichier est périmé (champs supprimés depuis, le
    #   chargement échouait) et contenait des données sensibles
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py check --deploy --fail-level ERROR

    startCommand: "gunicorn Durama.wsgi --timeout 60 --access-logfile -"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duramadb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
